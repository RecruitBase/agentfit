[build-system]
requires = ["setuptools>=75.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfit"
version = "0.2.0"
description = "Universal agent evaluation framework with multi-provider support and 7 evaluation dimensions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

authors = [
    {name = "Gabiro N. Arnauld", email = "gabiro@recruitbase.work"}
]
maintainers = [
    {name = "AgentFit Team", email = "agentfit@recruitbase.work"}
]

keywords = [
    "agent", "evaluation", "benchmark", "ai",
    "task-competence", "safety", "compliance",
    "llm", "openai", "anthropic", "multi-provider"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0.1,<2.0",

    # API / async stack
    "fastapi>=0.129,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.28,<1.0",
    "aiofiles>=23.2,<24",

    # Data / utils
    "markdown>=3.6,<4",
    "pyyaml>=6.0.2,<7",
    "tenacity>=8.2,<9",

    # ML / math
    "numpy>=1.26,<3",
    "scikit-learn>=1.7,<2",

    # Serialization / logging
    "dataclasses-json>=0.6.7,<1",
    "loguru>=0.7.2,<1",

    # DB / CLI
    "sqlalchemy>=2.0.40,<3",
    "click>=8.3,<9",
]

[project.optional-dependencies]

openai = [
    "openai>=1.12,<2",
]

anthropic = [
    "anthropic>=0.18,<1",
]

google = [
    "google-generativeai>=0.5,<1",
]

mistral = [
    "mistralai>=1.0,<2",
]

# DeepSeek, Qwen (DashScope), Groq, Together AI, Ollama all use the openai
# SDK under the hood — install agentfit[openai] for those providers.

adapters = [
    "openai>=1.12,<2",
    "anthropic>=0.18,<1",
    "google-generativeai>=0.5,<1",
    "mistralai>=1.0,<2",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
    "pre-commit>=3.6",
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]

bench = [
    "datasets>=2.18",
    "evaluate>=0.4.2",
]

server = [
    "psycopg2-binary>=2.9.10",
    "alembic>=1.16",
]

all = [
    "openai>=1.12,<2",
    "anthropic>=0.18,<1",
    "google-generativeai>=0.5,<1",

    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
    "pre-commit>=3.6",

    "datasets>=2.18",
    "evaluate>=0.4.2",
]

[project.urls]
Homepage = "https://github.com/RecruitBase/agentfit"
Documentation = "https://docs.agentfit.dev"
Repository = "https://github.com/RecruitBase/agentfit"
"Bug Tracker" = "https://github.com/RecruitBase/agentfit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentfit*"]

[tool.setuptools.package-data]
agentfit = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
agentfit = "agentfit.cli:main"