name: Eval Server — Test, Build, Deploy

on:
  push:
    branches: [main]
    paths:
      - "Eval Server/**"
      - ".github/workflows/deploy-eval-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "Eval Server/**"

env:
  REGISTRY:   ghcr.io
  # GHCR requires lowercase — hardcode the slug instead of using
  # ${{ github.repository_owner }} which preserves mixed case (RecruitBase).
  IMAGE_NAME: recruitbase/agentfit-eval-server

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — TESTS
# Runs on every push and PR; blocks deploy if any test fails.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Eval Server"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Eval Server/requirements.txt"

      - name: Install dependencies
        # Install without the agentfit private package for CI speed.
        # If agentfit is public on PyPI later, remove the sed line.
        run: |
          sed '/^agentfit/d' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: pip install ruff && ruff check . --select E,F,W --ignore E501

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — BUILD & PUSH
  # Only runs on pushes to main (not PRs).
  # ─────────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & push Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      full_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-injected, no secret needed

      - name: Set up Docker Buildx (for layer caching)
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long          # ghcr.io/.../agentfit-eval-server:<sha>
            type=raw,value=latest                  # ghcr.io/.../agentfit-eval-server:latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: "Eval Server"
          file:    "Eval Server/Dockerfile"
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha        # GitHub Actions layer cache — much faster rebuilds
          cache-to:   type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — DEPLOY (blue-green, zero downtime)
  # SSHs into the Azure VM and runs /opt/agentfit/deploy.sh
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure VM
    needs: build-push
    runs-on: ubuntu-latest
    environment: production      # adds a manual approval gate if you configure one

    steps:
      - name: SSH deploy (blue-green)
        uses: appleboy/ssh-action@v1
        with:
          host:        ${{ secrets.VM_HOST }}
          username:    ${{ secrets.VM_USER }}
          key:         ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script_stop: true   # abort on first error
          timeout:     120s
          script: |
            set -euo pipefail

            IMAGE="${{ needs.build-push.outputs.full_image }}"
            echo "Deploying image: $IMAGE"

            # Authenticate to GHCR (needed if the package is private)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            bash /opt/agentfit/deploy.sh "$IMAGE"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            # Hit the health endpoint via nginx (the public path)
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost/health)
            if [ "$STATUS" != "200" ]; then
              echo "Health check failed with status $STATUS"
              exit 1
            fi
            echo "✓ Deployment verified (HTTP $STATUS)"
